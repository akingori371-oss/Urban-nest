{% extends "base.html" %}
{% block title %}Sign up · BookIt{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:420px"><div class="card-body">
  <h3 class="mb-3">Create an account</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Sign up</button>
  </form>
  <p class="mt-3 mb-0 text-center">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div></div>
{% endblock %}
