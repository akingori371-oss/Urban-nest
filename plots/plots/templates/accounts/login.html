{% extends "base.html" %}
{% block title %}Log in · BookIt{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:420px"><div class="card-body">
  <h3 class="mb-3">Log in</h3>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3 mb-0 text-center">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div></div>
{% endblock %}
